# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "11ab8143e646040a98994029dda86aa8"
name = "tax-exemption-manager"
application_url = "https://example.com"
embedded = true

[access_scopes]
# Scopes required for tax exemption mutations and customer/company read access
scopes = "read_customers,write_customers,read_companies,write_companies,read_orders"



[webhooks]
# Locked to 2026-04 per spec — do not change to "latest" or a newer version
# without verifying that all tax exemption mutations used in this app are
# still present and behave identically in the target version.
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]


[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[app_proxy]
url = "https://example.com/api/proxy"
subpath = "tax-exemptions"
prefix = "apps"
