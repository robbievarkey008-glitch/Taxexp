# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "11ab8143e646040a98994029dda86aa8"
name = "Exemptify: Tax Exemptions"
application_url = "https://tax-exemption-manager.vercel.app"
embedded = true

[access_scopes]
# Scopes required for tax exemption mutations and customer/company read access
scopes = "read_customers,write_customers,read_companies,write_companies,read_orders"



[webhooks]
# Locked to 2026-04 per spec — do not change to "latest" or a newer version
# without verifying that all tax exemption mutations used in this app are
# still present and behave identically in the target version.
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]


[auth]
redirect_urls = [
  "https://tax-exemption-manager.vercel.app/auth/callback",
  "https://tax-exemption-manager.vercel.app/auth/shopify/callback",
  "https://tax-exemption-manager.vercel.app/api/auth/callback"
]

[build]
automatically_update_urls_on_dev = true

[app_proxy]
url = "https://tax-exemption-manager.vercel.app/api/proxy"
subpath = "tax-exemptions"
prefix = "apps"

[webhooks.privacy_compliance]
customer_deletion_url = "https://tax-exemption-manager.vercel.app/webhooks/customers/redact"
customer_data_request_url = "https://tax-exemption-manager.vercel.app/webhooks/customers/data_request"
shop_deletion_url = "https://tax-exemption-manager.vercel.app/webhooks/shop/redact"

